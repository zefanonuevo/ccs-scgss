<svg viewBox="0 0 1040 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scgss-architecture-title scgss-architecture-desc" id="architecture-root">
        <title id="scgss-architecture-title">SCGSS application architecture</title>
        <desc id="scgss-architecture-desc">Architecture diagram: the web app calls the API, which asks the CCS portal who is signed in and passes actions to the rules engine; the engine reads and writes PostgreSQL, the API saves uploads to disk, timers run reminders, and a Google link copies records to Google Workspace.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f4f7f3;
      --color-ink:     #111a15;
      --color-muted:   #4a5a51;
      --color-accent:  #0b5d45;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
