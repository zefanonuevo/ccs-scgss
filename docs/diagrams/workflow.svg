<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scgss-workflow-title scgss-workflow-desc" id="workflow-root">
        <title id="scgss-workflow-title">SCGSS application status</title>
        <desc id="scgss-workflow-desc">State machine showing an application moving from Pending through approval, report verification and filing at the FAO, with return and reject paths.</desc>
        <defs>
      <style>#workflow-root { --color-paper:   #f4f7f3;
      --color-ink:     #111a15;
      --color-muted:   #4a5a51;
      --color-accent:  #0b5d45;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#workflow-root .diagram-container { overflow-x: visible; }
}</style>
