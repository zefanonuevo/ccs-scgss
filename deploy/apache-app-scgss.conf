# On the PORTAL VM: /etc/apache2/conf-available/app-scgss.conf
# Include it INSIDE the portal's existing HTTPS <VirtualHost>, ABOVE the line "ProxyPass / http://127.0.0.1:3000/"  (the portal writes it with extra spaces: ProxyPass        / http://127.0.0.1:3000/ )
# (Apache uses the first matching ProxyPass, so the specific path must come before "/"):
#     IncludeOptional conf-available/app-scgss.conf
# Replace APPS-VM-PRIVATE-IP with the apps VM's private address. Test, then reload:
#     sudo apache2ctl configtest && sudo systemctl reload apache2
# /scgss (no slash) must not be proxied to the portal; ProxyPass is evaluated before RedirectMatch, so exclude it first.
ProxyPassMatch ^/scgss$ !
RedirectMatch ^/scgss$ /scgss/
ProxyPass        /scgss/ http://APPS-VM-PRIVATE-IP:3001/
ProxyPassReverse /scgss/ http://APPS-VM-PRIVATE-IP:3001/
# never trust an identity header sent by a browser
RequestHeader unset X-User-Email
# The portal sends a strict Content-Security-Policy on every page. SCGSS needs two additions: blob: (the PDF/image preview of uploaded files)
# in frame-src and img-src. Scripts stay 'self' only: the page has no inline scripts. This replaces the portal's header for /scgss/ only.
<Location /scgss/>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://zefanonuevo.github.io https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'"
</Location>
