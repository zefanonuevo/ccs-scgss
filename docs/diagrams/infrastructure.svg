        <title id="scgss-infrastructure-title">How a request reaches SCGSS</title>
        <desc id="scgss-infrastructure-desc">Architecture diagram: the browser reaches the CCS portal through Cloudflare, the portal proxies to the SCGSS server on the private apps VM, which stores records in PostgreSQL and files on disk and sends copies to Google through an Apps Script.</desc>
        <defs>
      <style>#infrastructure-root { --color-paper:   #f4f7f3;
      --color-ink:     #111a15;
      --color-muted:   #4a5a51;
      --color-accent:  #0b5d45;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #infrastructure-root { font-family: var(--font-sans); color: var(--color-ink); }
      #infrastructure-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#infrastructure-root .diagram-container { overflow-x: visible; }
}</style>
